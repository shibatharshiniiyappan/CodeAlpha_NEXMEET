# ==============================================================================
# Render Infrastructure Blueprint for NEXMEET
# ==============================================================================
# Deploys the unified full-stack Node.js + Express + Socket.IO + Vite service.
# Documentation: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: nexmeet
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
